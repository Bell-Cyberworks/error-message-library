# Local stack for build/test — same shape intended for self-hosted deployment.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eml
      POSTGRES_PASSWORD: eml
      POSTGRES_DB: eml
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  error-management-ui:
    build: ./error-management-ui
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://eml:eml@postgres:5432/eml
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env or the shell environment, e.g. via openssl rand -base64 32}
    ports:
      - "3000:3000"

  error-ui:
    build: ./error-ui
    depends_on:
      - error-management-ui
    environment:
      MANAGEMENT_API_URL: http://error-management-ui:3000
    ports:
      - "3001:3000"

volumes:
  postgres-data:

# Local stack for build/test — same shape intended for self-hosted deployment.
# Placeholder: error-ui's image doesn't exist yet.
# `docker-compose up postgres error-management-ui` works today; error-ui will come online
# once it gets its own Dockerfile.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eml
      POSTGRES_PASSWORD: eml
      POSTGRES_DB: eml
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  error-management-ui:
    build: ./error-management-ui
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://eml:eml@postgres:5432/eml
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env or the shell environment, e.g. via openssl rand -base64 32}
    ports:
      - "3000:3000"

  # error-ui:
  #   build: ./error-ui
  #   depends_on:
  #     - error-management-ui
  #   ports:
  #     - "8081:8081"

volumes:
  postgres-data:
